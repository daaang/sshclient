name: "Build weekly and on push to main"

on:
  push:
    branches: ["main"]
  schedule:
  - cron: "0 7 * * 0"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: "ubuntu-latest"
    steps:
    - uses: "actions/checkout@v3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
    - uses: "mr-smithers-excellent/docker-build-push@vef432483bd0252dd948d1d11e60c96a1c93646a9" # v7
      with:
        image: "sshclient"
        addLatest: true
        addTimestamp: true
        registry: "ghcr.io"
        username: "${{ github.actor }}"
        password: "${{ secrets.GITHUB_TOKEN }}"
